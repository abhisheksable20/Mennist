
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Mennist | Under Maintenance</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0D0D0D;
            color: #FAFAFA;
            font-family: 'Open Sans', Arial, sans-serif;
            padding: 24px;
        }

        .container {
            width: 100%;
            max-width: 480px;
            text-align: center;
        }

        .brand {
            font-size: 50px;
            font-weight: 700;
            font-family: 'Poppins', sans-serif;
            letter-spacing: -1px;
            margin: 0 auto 28px;
            color: #22C55E;
        }

        .icon {
            width: 76px;
            height: 76px;
            margin: 0 auto 28px;
            border-radius: 22px;
            background: #171717;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
        }

        h1 {
            font-size: 30px;
            margin-bottom: 16px;
            letter-spacing: -1px;
        }

        p {
            color: #999999;
            font-size: 15px;
            line-height: 1.8;
        }

        .status {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-top: 30px;
            padding: 10px 16px;
            border: 1px solid #333333;
            border-radius: 30px;
            color: #cccccc;
            font-size: 13px;
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #F59E0B;
        }

        .footer {
            margin-top: 65px;
            font-size: 12px;
            color: #555555;
        }
    </style>
</head>

<body>
    <main class="container">
        <h1 class="brand">MENNIST</h1>

        <div class="icon">🛠️</div>

        <h1>We'll be back soon.</h1>

        <p>
            We're making some improvements to Mennist
            to give you a better experience.
            <br />
            <br />
            Your thoughts, secrets and echoes aren't going anywhere.
            We'll be back shortly.
        </p>

        <div class="status">
            <span class="dot"></span>
            Temporarily under maintenance
        </div>

        <div class="footer">
            © 2026 Mennist. All rights reserved.
        </div>
    </main>
</body>
</html>
