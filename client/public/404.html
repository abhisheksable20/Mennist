
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0D0D0D" />

    <title>404 - Page Not Found | Mennist</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: #0D0D0D;
            color: #F5F5F5;
            font-family: "Open Sans", Arial, sans-serif;
            text-align: center;
        }

        .container {
            width: 100%;
            max-width: 480px;
        }

        .brand {
            font-size: 25px;
            font-weight: 700;
            letter-spacing: -1px;
            color: #FFFFFF;
            margin-bottom: 55px;
        }

        .error-code {
            font-size: clamp(100px, 25vw, 150px);
            font-weight: 800;
            line-height: 1;
            letter-spacing: -10px;
            color: #4B352A;
        }

        h1 {
            font-size: 25px;
            margin-top: 25px;
            margin-bottom: 12px;
        }

        p {
            color: #A3A3A3;
            font-size: 15px;
            line-height: 1.7;
            margin-bottom: 30px;
        }

        .home-button {
            display: inline-block;
            padding: 12px 25px;
            background: #22C55E;
            color: #0D0D0D;
            text-decoration: none;
            font-size: 14px;
            font-weight: 700;
            border-radius: 7px;
            transition: background 0.2s ease,
                        transform 0.2s ease;
        }

        .home-button:hover {
            background: #16A34A;
            transform: translateY(-2px);
        }

        .footer {
            margin-top: 65px;
            font-size: 12px;
            color: #666666;
        }

        @media (max-width: 480px) {
            .brand {
                margin-bottom: 45px;
            }

            h1 {
                font-size: 22px;
            }

            p {
                font-size: 14px;
            }
        }
    </style>
</head>

<body>
    <main class="container">
        <div class="brand">Mennist.</div>

        <div class="error-code">404</div>

        <h1>Lost your way?</h1>

        <p>
            Looks like this page doesn't exist or may have been moved.
            Don't worry, there's always a way back.
        </p>

        <a href="/" class="home-button">Back to Home</a>

        <div class="footer">
            © <span id="year"></span> Mennist. All rights reserved.
        </div>
    </main>

    <script>
        document.getElementById("year").textContent =
            new Date().getFullYear();
    </script>
</body>
</html>
